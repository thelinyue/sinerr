  /settings/mediary:
    get:
      summary: Get Mediary settings
      description: Returns all Mediary settings in a JSON array.
      tags:
        - settings
      responses:
        '200':
          description: 'Values were returned'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediarySettings'
    post:
      summary: Create Mediary instance
      description: Creates a new Mediary instance from the request body.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediarySettings'
      responses:
        '201':
          description: 'New Mediary instance created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediarySettings'
  /settings/mediary/test:
    post:
      summary: Test Mediary configuration
      description: Tests if the Mediary configuration is valid.
      tags:
        - settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname:
                  type: string
                  example: '127.0.0.1'
                port:
                  type: number
                  example: 8118
                apiKey:
