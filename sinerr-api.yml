  /review/{tmdbId}/{mediaType}:
    get:
      summary: Get media reviews
      description: |
        Returns the reviews and average rating for a specific media item.

        For series, pass `seasonNumber` and/or `episodeNumber` to filter reviews to a specific season or episode. Without these parameters, only whole-series reviews are returned.

        Requires authentication. Review messages are visible to any authenticated user.
      tags:
        - review
      parameters:
        - in: path
          name: tmdbId
          description: TMDB ID of the media
          required: true
          schema:
            type: string
        - in: path
          name: mediaType
          description: Media type
          required: true
          schema:
            type: string
            enum: [movie, tv]
        - in: query
          name: seasonNumber
          description: Filter reviews to a specific season (series only)
          required: false
          schema:
            type: integer
        - in: query
          name: episodeNumber
          description: Filter reviews to a specific episode within a season (requires seasonNumber)
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Reviews for the media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaReviews'
        '404':
          description: Media not found
    post:
      summary: Create or update a media review
      description: |
        Creates a review for a media item (or updates the current user's existing review for the same target).

        For series, pass `seasonNumber` and/or `episodeNumber` to review a specific season or episode. When neither is provided, the review targets the whole series. A user may only have one review per media item and target.

        Requires the `REQUEST` permission or `ADMIN`.
      tags:
        - review
      parameters:
        - in: path
          name: tmdbId
          description: TMDB ID of the media
          required: true
          schema:
            type: string
        - in: path
          name: mediaType
          description: Media type
          required: true
          schema:
            type: string
            enum: [movie, tv]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  example: 4
                message:
                  type: string
                  example: Great film!
                seasonNumber:
                  type: integer
                  nullable: true
                  description: Target season (series only). Omit or null for whole series.
                episodeNumber:
                  type: integer
                  nullable: true
                  description: Target episode within a season. Requires seasonNumber.
              required:
                - rating
                - message
      responses:
        '201':
          description: Review created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaReview'
        '400':
          description: Invalid rating, message, or season/episode target
        '404':
          description: Media not found
  /review/{reviewId}:
    delete:
      summary: Delete a media review
      description: |
        Deletes a media review. Authors can delete their own reviews; users with the `MANAGE_REQUESTS` permission can delete any review.

        Requires the `REQUEST` permission or `ADMIN`.
      tags:
        - review
      parameters:
        - in: path
          name: reviewId
          description: Review ID
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Review deleted
        '403':
          description: Not permitted to delete this review
        '404':
          description: Review not found
  /media:
    get:
      summary: Get media
      description: Returns all media (can be filtered and limited) in a JSON object.
      tags:
        - media
      parameters:
        - in: query
          name: take
          schema:
            type: number
            nullable: true
            example: 20
        - in: query
          name: skip
          schema:
            type: number
            nullable: true
            example: 0
        - in: query
          name: filter
          schema:
            type: string
            nullable: true
            enum:
              [
                all,
                available,
                partial,
                allavailable,
                processing,
                pending,
                deleted,
              ]
        - in: query
          name: sort
          schema:
            type: string
            enum: [added, modified, mediaAdded]
            default: added
      responses:
        '200':
          description: Returned media
          content:
            application/json:
              schema:
                type: object
                properties:
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaInfo'
  /media/{mediaId}:
    delete:
      summary: Delete media item
      description: Removes a media item. The `MANAGE_REQUESTS` permission is required to perform this action.
      tags:
        - media
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
      responses:
        '204':
          description: Succesfully removed media item
  /media/{mediaId}/file:
    delete:
      summary: Delete media file
      description: Removes a media file from the download client. The `ADMIN` permission is required to perform this action.
      tags:
        - media
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
        - in: query
          name: is4k
          description: Whether to remove from 4K service instance (true) or regular service instance (false)
          required: false
          example: false
          schema:
            type: boolean
      responses:
        '204':
          description: Successfully removed media item
  /media/{mediaId}/{status}:
    post:
      summary: Update media status
      description: Updates a media item's status and returns the media in JSON format
      tags:
        - media
      parameters:
        - in: path
          name: mediaId
          description: Media ID
          required: true
          example: '1'
          schema:
            type: string
        - in: path
          name: status
          description: New status
          required: true
          example: available
          schema:
            type: string
            enum: [available, partial, processing, pending, unknown, deleted]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is4k:
                  type: boolean
                  example: false
                  description: |
                    When true, updates the 4K status field (status4k).
                    When false or not provided, updates the regular status field (status).
                    This applies to all status values (available, partial, processing, pending, unknown).
      responses:
        '200':
          description: Returned media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaInfo'
  /media/{mediaId}/watch_data:
    get:
      summary: Get watch data
      description: |
        Returns play count, play duration, and users who have watched the media.

        Requires the `ADMIN` permission.
      tags:
        - media
      parameters:
        - in: path
